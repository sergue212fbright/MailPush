name: Publish MailPush F-Droid repository

on:
  workflow_call:
    secrets:
      FDROID_KEYSTORE_BASE64:
        description: Repository-index keystore from the mailpush-fdroid environment
        required: true
      FDROID_KEYSTORE_PASSWORD:
        description: Repository-index keystore password from the mailpush-fdroid environment
        required: true
  workflow_dispatch:
  # Refresh signed index timestamps even when no Android release is needed.
  schedule:
    - cron: '41 4 * * 0'

permissions:
  contents: read

# All entry points serialize against the same repository publication. This is
# deliberately different from the caller's release group to avoid a deadlock.
concurrency:
  group: mailpush-fdroid
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test feed trust boundaries without secrets
        run: python -m unittest discover -s tests -p 'test_fdroid*.py' -v
      - name: Install Android verification tools
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'build-tools;36.0.0'"
      - name: Install hash-locked repository tooling
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          lock = Path('fdroid/requirements-lock.txt').read_text()
          start, end = '# BEGIN BUILD TOOLS\n', '# END BUILD TOOLS\n'
          if lock.count(start) != 1 or lock.count(end) != 1:
              raise SystemExit('Expected one build-tool bootstrap block')
          block = lock.split(start, 1)[1].split(end, 1)[0]
          lines = [line for line in block.splitlines() if line.strip()]
          if len(lines) != 4 or not all(re.fullmatch(
              r'[A-Za-z0-9_.-]+==[A-Za-z0-9_.+-]+ --hash=sha256:[a-f0-9]{64}',
              line) for line in lines):
              raise SystemExit('Expected four hash-pinned build tools')
          (Path(os.environ['RUNNER_TEMP']) / 'mailpush-fdroid-bootstrap.txt').write_text(block)
          PY
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/mailpush-fdroid-bootstrap.txt"
          python -m pip --isolated install --index-url https://pypi.org/simple --no-build-isolation --require-hashes -r fdroid/requirements-lock.txt
      - name: Prepare and verify unsigned repository data
        # No index-signing environment or private key is available on this runner.
        # Keep this job enabled with FDROID_READY=false for the bootstrap check.
        run: python scripts/prepare_fdroid.py --output .work/fdroid-prepared --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Verify index and isolated APK checks without a private key
        # Exercise the actual Ubuntu UID/PID/proc/network isolation before any
        # production key is supplied, including during bootstrap validation.
        run: python scripts/sign_fdroid.py --verify-only --input .work/fdroid-prepared --output .work/fdroid-preflight --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Retain keyless verification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid-preflight
          path: .work/fdroid-preflight/manifest.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid-prepared
          path: .work/fdroid-prepared/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FDROID_READY == 'true'
    environment: mailpush-fdroid
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android verification tools
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'build-tools;36.0.0'"
      - name: Install hash-locked repository tooling
        # Install dependencies before exposing signing secrets to a single step.
        # Reusable callers must forward the two declared names even when their
        # values are held in this job's protected environment.
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          lock = Path('fdroid/requirements-lock.txt').read_text()
          start, end = '# BEGIN BUILD TOOLS\n', '# END BUILD TOOLS\n'
          if lock.count(start) != 1 or lock.count(end) != 1:
              raise SystemExit('Expected one build-tool bootstrap block')
          block = lock.split(start, 1)[1].split(end, 1)[0]
          lines = [line for line in block.splitlines() if line.strip()]
          if len(lines) != 4 or not all(re.fullmatch(
              r'[A-Za-z0-9_.-]+==[A-Za-z0-9_.+-]+ --hash=sha256:[a-f0-9]{64}',
              line) for line in lines):
              raise SystemExit('Expected four hash-pinned build tools')
          (Path(os.environ['RUNNER_TEMP']) / 'mailpush-fdroid-bootstrap.txt').write_text(block)
          PY
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/mailpush-fdroid-bootstrap.txt"
          python -m pip --isolated install --index-url https://pypi.org/simple --no-build-isolation --require-hashes -r fdroid/requirements-lock.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fdroid-prepared
          path: .work/fdroid-prepared
      - name: Sign and verify repository index
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: python scripts/sign_fdroid.py --input .work/fdroid-prepared --output .work/fdroid-signed --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Stage public Pages files only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .work/fdroid-signed/site
          retention-days: 3
      - name: Retain repository verification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid-verification
          path: .work/fdroid-signed/manifest.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: sign
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This third runner receives only the Pages artifact, never signing keys.
      - name: Deploy signed repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
