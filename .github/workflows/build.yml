name: Validate and update MailPush

# GitHub runs schedules on the default branch. Publication remains an opt-in
# repository setting until the owner installs their signing key and email config.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: mailpush-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.source.outputs.needed }}
      upstream: ${{ steps.source.outputs.upstream_commit }}
      module: ${{ steps.source.outputs.module_sha256 }}
      code: ${{ steps.source.outputs.version_code }}
      tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select source
        id: source
        env:
          GH_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$PR" = true ]; then
            python3 scripts/upstream_check.py --pinned
          else
            python3 scripts/upstream_check.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selection
          path: .work/selection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  checks:
    needs: select
    # Connector-only changes may not need a new Android APK. Still validate
    # every code change; skip unchanged six-hour polls to conserve CI time.
    if: needs.select.outputs.needed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Connector and release-boundary tests
        run: |
          python -m pip install -r connector/requirements-lock.txt
          python -m pip install --no-deps ./connector
          python -m unittest discover -s connector/tests -v
          python -m unittest discover -s tests -v
      - name: Validate module, lint and cross-language cryptography
        run: |
          python3 scripts/verify_wrapper.py module-check
          cd module-check
          ./gradlew --no-daemon :mailpush:assembleRelease :mailpush:testReleaseUnitTest :mailpush:lintRelease
          cd ..
          python3 connector/tools/verify_android_interop.py modules/mailpush

  device:
    needs: select
    if: needs.select.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-mailpush-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          working-directory: module-check
          disable-animations: true
          script: |
            ./gradlew --no-daemon :mailpush:assembleDebugAndroidTest
            python3 ../scripts/run_device_checks.py
      - name: Retain Android security gate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-checks
          path: .work/device-checks/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: select
    if: needs.select.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: selection
          path: .work
      - name: Prepare strictly checked Proton overlay
        env:
          UPSTREAM_SHA: ${{ needs.select.outputs.upstream }}
          VERSION_CODE: ${{ needs.select.outputs.code }}
        run: python3 scripts/prepare_upstream.py --revision "$UPSTREAM_SHA" --version-code "$VERSION_CODE"
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          min-wrapper-count: '1'
      - name: Validate Gradle distribution and SDK versions
        run: |
          python3 scripts/verify_wrapper.py .work/proton
          python3 scripts/install_sdk.py .work/proton
      - name: Build unsigned production APK
        # No signing, SMTP or write-capable token enters the upstream build.
        working-directory: .work/proton
        run: ./gradlew --no-daemon :app:assembleProdRelease
      - name: Check compiled manifest and stage corresponding source
        env:
          VERSION_CODE: ${{ needs.select.outputs.code }}
        run: |
          mkdir -p .work/unsigned
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          apks=list(Path('.work/proton/app/build/outputs/apk/prod/release').glob('*-unsigned.apk'))
          if len(apks)!=1: raise SystemExit('Expected exactly one unsigned production APK')
          shutil.copyfile(apks[0],'.work/unsigned/unsigned.apk')
          shutil.copyfile('.work/selection.json','.work/unsigned/selection.json')
          PY
          python3 scripts/audit_apk.py .work/unsigned/unsigned.apk --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --version-code "$VERSION_CODE"
          python3 scripts/bundle_sources.py .work/proton --output .work/unsigned/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-build
          path: .work/unsigned/*
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [select, checks, device, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SIGNING_READY == 'true' && needs.select.outputs.needed == 'true'
    environment: mailpush-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # This runner checks out only the maintained overlay repository. The full
      # Proton source is downloaded as an inert archive, never extracted/run here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-build
          path: .work/unsigned
      - name: Install signing tools
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'build-tools;36.0.0'"
      - name: Sign and verify APK
        env:
          VERSION_CODE: ${{ needs.select.outputs.code }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ vars.SIGNING_ALIAS || 'mailpush' }}
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          python3 scripts/sign_apk.py .work/unsigned/unsigned.apk --output .work/signed/MailPush.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --version-code "$VERSION_CODE"
          python3 scripts/stage_release.py --input .work/unsigned --output .work/signed --build-tools "$ANDROID_HOME/build-tools/36.0.0" --version-code "$VERSION_CODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: .work/signed/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [select, sign]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: .work/signed
      - name: Publish immutable signed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.select.outputs.upstream }}
          MODULE_SHA256: ${{ needs.select.outputs.module }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
        run: python3 scripts/publish_release.py .work/signed --upstream "$UPSTREAM_SHA" --module-sha256 "$MODULE_SHA256" --tag "$RELEASE_TAG"

  failure-email:
    needs: [select, checks, device, build, sign, publish]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FAILURE_EMAIL_ENABLED == 'true' && contains(needs.*.result, 'failure')
    environment: mailpush-notifications
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Send minimal failure notice over verified TLS
        env:
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT || '465' }}
          MAIL_MODE: ${{ vars.MAIL_MODE || 'ssl' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/notify_failure.py
