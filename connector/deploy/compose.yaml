# Linux amd64 full stack. Bridge is the official pinned installer, unmodified.
services:
  bridge:
    build:
      context: .
      dockerfile: Bridge.Dockerfile
    image: mailpush-bridge:3.27.1
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - bridge-data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    # No published IMAP or SMTP ports. Follow the image's initial login instructions.
  connector:
    build:
      context: ..
    image: mailpush-connector:0.3.0a1
    restart: unless-stopped
    depends_on:
      - bridge
    network_mode: service:bridge
    volumes:
      - ./config:/config:ro
      - connector-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 60s
volumes:
  bridge-data:
  connector-data:
