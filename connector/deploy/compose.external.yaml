# An existing community/source-built Bridge image, including non-amd64 hosts.
services:
  bridge:
    image: ${BRIDGE_IMAGE:?Set BRIDGE_IMAGE to a reviewed Bridge image and fixed version}
    restart: unless-stopped
    volumes:
      # Adapt this state path to the selected image's documentation.
      - bridge-data:/data
  connector:
    build:
      context: ..
    image: mailpush-connector:0.3.0a1
    restart: unless-stopped
    depends_on: [bridge]
    network_mode: service:bridge
    volumes:
      - ./config:/config:ro
      - connector-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    stop_grace_period: 60s
volumes:
  bridge-data:
  connector-data:
