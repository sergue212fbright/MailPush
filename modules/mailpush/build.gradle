plugins { id 'com.android.library' }

android {
    namespace 'app.mailpush.companion'
    compileSdk 36
    defaultConfig {
        minSdk 29
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = false }
    lint { abortOnError true }
}

dependencies {
    implementation 'org.unifiedpush.android:connector:3.3.5'
    // The host already uses WorkManager. Keep receiver/account I/O off callbacks
    // without adding a permanent service or another persistent connection.
    implementation 'androidx.work:work-runtime:2.11.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.google.crypto.tink:tink:1.24.0'
}
